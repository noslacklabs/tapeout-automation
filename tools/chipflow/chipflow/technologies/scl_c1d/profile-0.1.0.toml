# The shipped frame carries AIPAD00/IPAD00 input structures in every signal
# window.  Leaving one in place is a deliberate "no core connection" choice, not
# an unspecified floating CMOS input: AIPAD00 has no core output, and IPAD00 is
# a resistor to OUT1.  This policy is limited to those shipped cells and cites
# the frame-level LVS baseline; full targeted LVS remains a later milestone.
[[unused_slot_policy]]
id = "shipped-input-pad-open"
evidence = "reference/milestone1/acceptance.json"
allowed_cells = ["AIPAD00", "IPAD00"]
description = "Keep the frame's shipped input pad with its core side open."

