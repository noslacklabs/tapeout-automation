[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipflow"
version = "0.1.0.dev4"
description = "Private, provenance-first digital chip automation foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chipflow = "chipflow.cli:main"

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chipflow*"]

[tool.setuptools.package-data]
chipflow = ["resources/*", "resources/**/*", "technologies/**/*.json", "technologies/**/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
