[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presubmit-check"
version = "0.1.0"
description = "Read-only pre-submission checker for eChipHub-SCL MPW GDSII files (SCL 1.2 um C1D). Private: not for publication."
requires-python = ">=3.11"
dependencies = ["klayout==0.30.12"]

[project.optional-dependencies]
test = ["pytest", "gdstk==1.0.2"]

[project.scripts]
presubmit-check = "presubmit_check.cli:main"

[tool.setuptools]
packages = ["presubmit_check"]

[tool.setuptools.package-data]
presubmit_check = ["config/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pdk: needs the real PDK; skipped when it is not present"]
